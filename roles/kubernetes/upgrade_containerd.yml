---
# Dedicated container-runtime upgrade — moves nodes to containerd 2.x and
# regenerates /etc/containerd/config.toml to the v3 schema, one node at a time,
# draining first. This is intentionally SEPARATE from upgrade_os.yml: OS
# patching holds containerd (see the holds in upgrade_os.yml) so it never does
# a surprise major runtime jump; this playbook is the deliberate, tested path
# for that jump.
#
# In-place by design (NO reboot): the standard runtime-upgrade procedure is
# drain -> upgrade package -> restart containerd -> uncordon. Skipping the
# reboot avoids the ~5 min kubelet-startup DiskPressure blip and, on control
# plane nodes, keeps etcd/apiserver static pods running through the restart
# (containerd preserves running containers across a restart via shim survival).
# If you also want a kernel/OS refresh, run upgrade_os.yml afterwards.
#
# Idempotent: a node already on containerd 2.x with a v3 config is skipped, so
# re-running is safe and a node validated as a canary is a no-op.
#
# Usage:
#   ansible-playbook -i dev_hosts.yml roles/kubernetes/upgrade_containerd.yml
#   # canary a single node first:
#   ansible-playbook -i dev_hosts.yml roles/kubernetes/upgrade_containerd.yml --limit 192.168.3.41

########################################################################
# Play 1 — Ensure control-plane kubeconfig is current and HA
########################################################################
- name: Ensure control-plane kubeconfig is current and HA
  hosts: kube_server
  become: true
  remote_user: debian
  any_errors_fatal: true

  tasks:
    - name: Ensure .kube directory exists
      file:
        path: "{{ home_dir }}/.kube"
        state: directory
        owner: debian
        group: debian
        mode: "0700"

    - name: Read cluster admin.conf
      slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Render kubeconfig pointed at the control-plane VIP
      copy:
        content: "{{ admin_conf.content | b64decode | regex_replace('server: https?://.*', 'server: https://' ~ control_vip ~ ':' ~ haproxy_port) }}"
        dest: "{{ home_dir }}/.kube/config"
        owner: debian
        group: debian
        mode: "0600"

########################################################################
# Play 2 — Pre-flight checks + suspend Flux
########################################################################
- name: Containerd upgrade pre-flight checks
  hosts: kube_server[0]
  become: false
  remote_user: debian
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ home_dir }}/.kube/config"

  tasks:
    - name: Verify all nodes are Ready
      shell: kubectl get nodes --no-headers | grep -v ' Ready' || true
      changed_when: false
      register: not_ready_nodes

    - name: Fail if any nodes are not Ready
      fail:
        msg: >-
          Some nodes are not Ready. Resolve before upgrading containerd:
          {{ not_ready_nodes.stdout }}
      when: not_ready_nodes.stdout | trim != ""

    - name: Display current node status and runtime versions
      command: kubectl get nodes -o wide
      changed_when: false
      register: node_status

    - name: Show node status
      debug:
        var: node_status.stdout_lines

    - name: Check if Flux CLI is available on the control node
      command: which flux
      delegate_to: localhost
      changed_when: false
      register: flux_check
      ignore_errors: true

    - name: Suspend Flux kustomizations
      command: flux suspend kustomization --all
      delegate_to: localhost
      environment:
        KUBECONFIG: "{{ control_node_kubeconfig }}"
      when: flux_check.rc == 0

########################################################################
# Play 3 — Upgrade control-plane containerd (one at a time)
########################################################################
- name: Containerd upgrade — control plane nodes
  hosts: kube_server
  serial: 1
  become: true
  remote_user: debian
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ home_dir }}/.kube/config"

  tasks:
    - name: Upgrade control-plane containerd
      vars:
        _runtime_packages:
          - containerd.io
          - cri-tools
          - kubernetes-cni
      block:
        - name: Resolve Kubernetes node name for this host
          shell: >
            kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name} {.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}'
            | awk '$2 == "{{ ansible_default_ipv4.address | default(inventory_hostname) }}" { print $1 }'
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          register: k8s_node_name_result

        - name: Fail if Kubernetes node name could not be resolved
          fail:
            msg: >-
              Could not resolve Kubernetes node name for {{ inventory_hostname }}.
              Check: kubectl get nodes -o wide
          when: k8s_node_name_result.stdout | trim == ""

        - name: Set k8s_node_name fact
          set_fact:
            k8s_node_name: "{{ k8s_node_name_result.stdout | trim }}"

        - name: Check installed containerd version
          command: containerd --version
          changed_when: false
          register: containerd_installed_version

        - name: Check current containerd config schema version
          command: grep -m1 '^version' /etc/containerd/config.toml
          changed_when: false
          failed_when: false
          register: containerd_cfg_version

        - name: Determine whether this node needs the containerd upgrade
          # A v3 config can only be produced and used by a containerd 2.x binary,
          # so "config is already version 3" is a sufficient and reliable
          # done-signal. We deliberately do NOT parse `containerd --version` text:
          # its output is "containerd.io vX.Y.Z" (note the 'v' prefix), which is
          # easy to mis-match and previously caused 2.x nodes to not skip.
          set_fact:
            node_needs_work: "{{ 'version = 3' not in containerd_cfg_version.stdout }}"

        - name: Skip message
          debug:
            msg: "Already on containerd 2.x with a v3 config — skipping {{ k8s_node_name }}"
          when: not node_needs_work | bool

        - name: Drain node
          command: "kubectl drain {{ k8s_node_name }} --ignore-daemonsets --delete-emptydir-data --timeout=300s"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          register: drain_result
          until: drain_result.rc == 0
          retries: 3
          delay: 30
          when: node_needs_work | bool

        - name: Unhold runtime packages
          dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop: "{{ _runtime_packages }}"
          when: node_needs_work | bool

        - name: Upgrade containerd and runtime tooling to latest
          apt:
            name: "{{ _runtime_packages }}"
            state: latest
            update_cache: yes
          when: node_needs_work | bool

        - name: Regenerate containerd config (v3 schema) and restart
          include_tasks: tasks/containerd_config.yml
          when: node_needs_work | bool

        - name: Re-hold runtime packages
          dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop: "{{ _runtime_packages }}"
          when: node_needs_work | bool

        - name: Wait for API server to be ready
          command: kubectl get --raw /readyz
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          register: api_ready
          until: api_ready.rc == 0
          retries: 30
          delay: 10
          when: node_needs_work | bool

        - name: Uncordon node
          command: "kubectl uncordon {{ k8s_node_name }}"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          register: uncordon_result
          until: uncordon_result.rc == 0
          retries: 6
          delay: 10
          when: node_needs_work | bool

        - name: Wait for node to become Ready
          command: "kubectl wait --for=condition=Ready node/{{ k8s_node_name }} --timeout=300s"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          when: node_needs_work | bool

      rescue:
        - name: Pick a healthy CP for rescue commands
          set_fact:
            rescue_delegate: >-
              {{ groups['kube_server'] | reject('equalto', inventory_hostname) | list
                 | first | default(inventory_hostname) }}

        - name: Attempt to uncordon node after failure
          command: "kubectl uncordon {{ k8s_node_name | default(inventory_hostname) }}"
          delegate_to: "{{ rescue_delegate }}"
          become: false
          ignore_errors: true

        - name: Check if Flux CLI is available on the control node (rescue)
          command: which flux
          delegate_to: localhost
          become: false
          changed_when: false
          register: flux_check_rescue
          ignore_errors: true

        - name: Resume Flux kustomizations after failure
          command: flux resume kustomization --all
          delegate_to: localhost
          become: false
          changed_when: false
          environment:
            KUBECONFIG: "{{ control_node_kubeconfig }}"
          when: flux_check_rescue.rc == 0
          ignore_errors: true

        - name: Fail with containerd upgrade error
          fail:
            msg: >-
              Containerd upgrade failed on {{ inventory_hostname }}
              (k8s node: {{ k8s_node_name | default('unknown') }}).
              Best-effort uncordon and Flux resume attempted (via {{ rescue_delegate }} / control node).
              Verify with: kubectl get nodes -o wide && systemctl status containerd
              Investigate and re-run.

########################################################################
# Play 4 — Upgrade worker containerd (one at a time)
########################################################################
- name: Containerd upgrade — worker nodes
  hosts: kube_agents
  serial: 1
  become: true
  remote_user: debian
  any_errors_fatal: true
  environment:
    KUBECONFIG: "{{ home_dir }}/.kube/config"

  tasks:
    - name: Upgrade worker containerd
      vars:
        _runtime_packages:
          - containerd.io
          - cri-tools
          - kubernetes-cni
      block:
        - name: Resolve Kubernetes node name for this host
          shell: >
            kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name} {.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}'
            | awk '$2 == "{{ ansible_default_ipv4.address | default(inventory_hostname) }}" { print $1 }'
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          register: k8s_node_name_result

        - name: Fail if Kubernetes node name could not be resolved
          fail:
            msg: >-
              Could not resolve Kubernetes node name for {{ inventory_hostname }}.
              Check: kubectl get nodes -o wide
          when: k8s_node_name_result.stdout | trim == ""

        - name: Set k8s_node_name fact
          set_fact:
            k8s_node_name: "{{ k8s_node_name_result.stdout | trim }}"

        - name: Check installed containerd version
          command: containerd --version
          changed_when: false
          register: containerd_installed_version

        - name: Check current containerd config schema version
          command: grep -m1 '^version' /etc/containerd/config.toml
          changed_when: false
          failed_when: false
          register: containerd_cfg_version

        - name: Determine whether this node needs the containerd upgrade
          # A v3 config can only be produced and used by a containerd 2.x binary,
          # so "config is already version 3" is a sufficient and reliable
          # done-signal. We deliberately do NOT parse `containerd --version` text:
          # its output is "containerd.io vX.Y.Z" (note the 'v' prefix), which is
          # easy to mis-match and previously caused 2.x nodes to not skip.
          set_fact:
            node_needs_work: "{{ 'version = 3' not in containerd_cfg_version.stdout }}"

        - name: Skip message
          debug:
            msg: "Already on containerd 2.x with a v3 config — skipping {{ k8s_node_name }}"
          when: not node_needs_work | bool

        - name: Drain worker node
          command: "kubectl drain {{ k8s_node_name }} --ignore-daemonsets --delete-emptydir-data --disable-eviction --timeout=300s"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          register: drain_result
          until: drain_result.rc == 0
          retries: 3
          delay: 30
          when: node_needs_work | bool

        - name: Unhold runtime packages
          dpkg_selections:
            name: "{{ item }}"
            selection: install
          loop: "{{ _runtime_packages }}"
          when: node_needs_work | bool

        - name: Upgrade containerd and runtime tooling to latest
          apt:
            name: "{{ _runtime_packages }}"
            state: latest
            update_cache: yes
          when: node_needs_work | bool

        - name: Regenerate containerd config (v3 schema) and restart
          include_tasks: tasks/containerd_config.yml
          when: node_needs_work | bool

        - name: Re-hold runtime packages
          dpkg_selections:
            name: "{{ item }}"
            selection: hold
          loop: "{{ _runtime_packages }}"
          when: node_needs_work | bool

        - name: Wait for kubelet to be active
          command: systemctl is-active kubelet
          register: kubelet_status
          until: kubelet_status.rc == 0
          retries: 30
          delay: 10
          changed_when: false
          when: node_needs_work | bool

        - name: Uncordon worker node
          command: "kubectl uncordon {{ k8s_node_name }}"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          register: uncordon_result
          until: uncordon_result.rc == 0
          retries: 6
          delay: 10
          when: node_needs_work | bool

        - name: Wait for worker node to become Ready
          command: "kubectl wait --for=condition=Ready node/{{ k8s_node_name }} --timeout=300s"
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          when: node_needs_work | bool

        # Draining force-stopped this node's Longhorn replicas; they rebuild
        # from the healthy peer after it returns. With serial:1 and two workers,
        # draining the next worker before this one's volumes are healthy would
        # leave a 2-replica volume with zero healthy replicas. Gate on volume
        # health. No-op (passes immediately) on clusters without Longhorn.
        - name: Wait for Longhorn volumes to finish rebuilding before next node
          shell: >-
            kubectl -n longhorn-system get volumes.longhorn.io
            -o jsonpath='{range .items[*]}{.status.robustness}{"\n"}{end}'
            | grep -E 'degraded|faulted' || true
          delegate_to: "{{ groups['kube_server'][0] }}"
          become: false
          changed_when: false
          register: longhorn_unhealthy
          until: longhorn_unhealthy.stdout | trim == ""
          retries: 30
          delay: 20
          when: node_needs_work | bool

      rescue:
        - name: Pick a healthy CP for rescue commands
          set_fact:
            rescue_delegate: "{{ groups['kube_server'][0] }}"

        - name: Attempt to uncordon worker after failure
          command: "kubectl uncordon {{ k8s_node_name | default(inventory_hostname) }}"
          delegate_to: "{{ rescue_delegate }}"
          become: false
          ignore_errors: true

        - name: Check if Flux CLI is available on the control node (rescue)
          command: which flux
          delegate_to: localhost
          become: false
          changed_when: false
          register: flux_check_rescue
          ignore_errors: true

        - name: Resume Flux kustomizations after failure
          command: flux resume kustomization --all
          delegate_to: localhost
          become: false
          changed_when: false
          environment:
            KUBECONFIG: "{{ control_node_kubeconfig }}"
          when: flux_check_rescue.rc == 0
          ignore_errors: true

        - name: Fail with containerd upgrade error
          fail:
            msg: >-
              Containerd upgrade failed on {{ inventory_hostname }}
              (k8s node: {{ k8s_node_name | default('unknown') }}).
              Best-effort uncordon and Flux resume attempted (via {{ rescue_delegate }} / control node).
              Verify with: kubectl get nodes -o wide && systemctl status containerd
              Investigate and re-run.

########################################################################
# Play 5 — Post-flight checks + resume Flux
########################################################################
- name: Containerd upgrade post-flight checks
  hosts: kube_server[0]
  become: false
  remote_user: debian
  environment:
    KUBECONFIG: "{{ home_dir }}/.kube/config"

  tasks:
    - name: Post-flight
      block:
        - name: Verify all nodes are Ready with their runtime versions
          command: kubectl get nodes -o wide
          changed_when: false
          register: final_node_status

        - name: Display final node status
          debug:
            var: final_node_status.stdout_lines

        - name: Check for NotReady nodes
          shell: kubectl get nodes --no-headers | grep -v ' Ready' || true
          changed_when: false
          register: not_ready_post

        - name: Fail if any nodes are not Ready after upgrade
          fail:
            msg: >-
              Some nodes are not Ready after the containerd upgrade:
              {{ not_ready_post.stdout }}
          when: not_ready_post.stdout | trim != ""

        - name: Check for unhealthy pods
          shell: kubectl get pods -A --no-headers | grep -v Running | grep -v Completed || true
          changed_when: false
          register: unhealthy_pods

        - name: Display unhealthy pods (tombstones from drains are expected; judge by workload readiness)
          debug:
            var: unhealthy_pods.stdout_lines
          when: unhealthy_pods.stdout | length > 0

        - name: Check if Flux CLI is available on the control node
          command: which flux
          delegate_to: localhost
          changed_when: false
          register: flux_check
          ignore_errors: true

        - name: Resume Flux kustomizations
          command: flux resume kustomization --all
          delegate_to: localhost
          environment:
            KUBECONFIG: "{{ control_node_kubeconfig }}"
          when: flux_check.rc == 0

        - name: Containerd upgrade complete
          debug:
            msg: "Containerd upgrade completed. Verify runtime versions in the node status above."

      rescue:
        - name: Check if Flux CLI is available on the control node (rescue)
          command: which flux
          delegate_to: localhost
          changed_when: false
          register: flux_check_rescue
          ignore_errors: true

        - name: Resume Flux kustomizations after post-flight failure
          command: flux resume kustomization --all
          delegate_to: localhost
          environment:
            KUBECONFIG: "{{ control_node_kubeconfig }}"
          changed_when: false
          when: flux_check_rescue.rc == 0
          ignore_errors: true

        - name: Fail with post-flight error
          fail:
            msg: >-
              Post-flight checks failed. The containerd upgrade itself may have
              completed but verification hit an error. Flux resume attempted.
              Run manually: kubectl get nodes -o wide && flux resume kustomization --all
