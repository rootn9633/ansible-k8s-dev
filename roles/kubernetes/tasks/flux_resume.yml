---
# Resume all Flux kustomizations from the control node (counterpart to
# tasks/flux_suspend.yml). No-op if the flux CLI is not present.
#
# Callers in a rescue block pass `flux_besteffort: true` so a resume failure
# does not mask the original error. The happy-path post-flight caller leaves
# it at the default (false) so a failure to resume — which would leave GitOps
# suspended — is surfaced loudly instead of swallowed.
- name: Check if Flux CLI is available on the control node
  command: which flux
  delegate_to: localhost
  become: false
  changed_when: false
  register: flux_cli_check
  ignore_errors: true

- name: Resume Flux kustomizations
  command: flux resume kustomization --all
  delegate_to: localhost
  become: false
  changed_when: false
  environment:
    KUBECONFIG: "{{ control_node_kubeconfig }}"
  when: flux_cli_check.rc == 0
  ignore_errors: "{{ flux_besteffort | default(false) }}"
